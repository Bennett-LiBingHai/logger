# pre-commit 配置：git commit 前自动检查/修复。
#
# 首次使用：
#   pip install pre-commit        # 或 sudo apt install pre-commit
#   pre-commit install            # 往 .git/hooks/ 装入口脚本（每个 clone 的人跑一次）
# 手动跑（不 commit 也能试）：
#   pre-commit run --all-files
#
# 注意：本地钩子可被 git commit --no-verify 绕过，CI 才是兜底闸门。

repos:
  # ---- clang-format 代码格式化（mirror：锁精确版本 + 自带二进制，跨机器一致）----
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8                      # 锁 clang-format 18.1.8（18.1.3 的 wheel 哈希已失效，用最新 18.x）
    hooks:
      - id: clang-format
        args: ["-i"]                  # [--dry-run, --Werror]只检查不改；想自动修复改成 ["-i"]
        types_or: [c, c++]            # 只处理 C/C++ 源文件

  # ---- 通用文件卫生检查（除了check-yaml和check-added-large-files,其它会自动改,需要重新git add） ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace       # 去掉行尾空白
      - id: end-of-file-fixer         # 文件末尾统一保留一个换行
      - id: check-yaml                # 校验 YAML 语法（本文件 / .clang-format 等）
      - id: check-added-large-files   # 防止误提交大文件（默认阈值 500KB）
      - id: mixed-line-ending         # 统一换行符为 LF（跨平台，避免 CRLF）
        args: [--fix=lf]

  # ---- 校验 commit message 格式（Conventional Commits）----
  - repo: local
    hooks:
      - id: commit-message
        name: 校验 commit message 格式
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
