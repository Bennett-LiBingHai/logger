name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Release 必须一起跑：有一类问题只在优化打开时出现 ——
        #   - fortify 的 -Wunused-result（Debug 下 _FORTIFY_SOURCE 不生效）
        #   - -fdelete-null-pointer-checks 把「对已知空指针的写」当 UB 删掉
        #   - -O3 内联掉函数，栈帧测试期望的帧名消失
        # 只编 Debug 这三类都发现不了
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang-format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find src include examples test -type f \
            \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) \
            -exec clang-format-18 --dry-run --Werror {} +

  clang-tidy:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang-tidy-18

      # compile_commands.json 由 CMAKE_EXPORT_COMPILE_COMMANDS 生成（CMakeLists 里已默认打开）
      # 关掉测试与基准：静态分析只关心库本身，能省一半配置时间
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF

      - name: Run clang-tidy
        run: |
          clang-tidy-18 -p build --quiet -warnings-as-errors='*' \
            src/*.cpp src/detail/*.cpp src/detail/formatter/*.cpp src/sink/*.cpp

  consumer:
    name: Consumer (find_package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      # 安装到 _prefix，再用 test/consumer 那个独立工程验证
      # find_package(logger) + logger::logger 这一整条路能走通
      - name: Install the library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build build -j"$(nproc)"
          cmake --install build --prefix "$PWD/_prefix"

      - name: Build and run a consumer
        run: |
          cmake -S test/consumer -B consumer-build -DCMAKE_PREFIX_PATH="$PWD/_prefix"
          cmake --build consumer-build
          ./consumer-build/consumer_app

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev

      - name: Configure
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DLOGGER_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build-san -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev

      - name: Lower ASLR entropy (TSan 需要)
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DLOGGER_SANITIZE=thread

      - name: Build
        run: cmake --build build-tsan -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure

  docs:
    name: API Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen

      # 走 CMake 的 docs 目标（README 里给用户的也是这条）。
      # 直接 `doxygen Doxyfile` 在干净检出上会失败：Doxyfile 的输出目录是 build/docs，
      # 而 Doxygen 只创建最后一级目录，缺 build/ 时报
      # "Output directory 'build/docs' does not exist and cannot be created"。
      # Doxyfile 里 WARN_AS_ERROR=YES，所以文档告警会直接让 doxygen 非零退出。
      - name: Generate API docs
        run: |
          cmake -S . -B build -DBUILD_DOCS=ON -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF
          cmake --build build --target docs

      - name: Check output
        run: test -f build/docs/html/index.html
